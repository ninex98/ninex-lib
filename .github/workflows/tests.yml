name: tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: tokenizer
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: composer test
      - run: php tests/Core/smoke.php
      - if: matrix.php == '8.3'
        run: composer lint
  laravel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10.0', bench: '8.0', legacy: true }
          - { php: '8.2', laravel: '11.0', bench: '9.0', legacy: true }
          - { php: '8.2', laravel: '12.0', bench: '10.0' }
          - { php: '8.3', laravel: '13.0', bench: '11.0' }
          - { php: '8.4', laravel: '13.0', bench: '11.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, tokenizer
          coverage: none
      - run: composer require 'laravel/framework:^${{ matrix.laravel }}' 'orchestra/testbench:^${{ matrix.bench }}' --no-update --working-dir=tests/environments/laravel
      - run: composer update --prefer-dist --no-interaction --working-dir=tests/environments/laravel
        # Isolated compatibility fixtures only. Keep advisory reporting and other policy checks.
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.legacy && '0' || '1' }}
      - run: composer check-platform-reqs --working-dir=tests/environments/laravel
      - run: php tests/environments/laravel/vendor/bin/phpunit -c phpunit.laravel.xml
  thinkphp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
        orm: ['3.0', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, tokenizer
          coverage: none
      - run: composer require 'topthink/think-orm:^${{ matrix.orm }}' --no-update --working-dir=tests/environments/thinkphp
      - run: composer update --prefer-dist --no-interaction --working-dir=tests/environments/thinkphp
      - run: composer check-platform-reqs --working-dir=tests/environments/thinkphp
      - run: php tests/environments/thinkphp/vendor/bin/phpunit -c phpunit.thinkphp.xml
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
        orm: ['3.0', '4.0']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ninex-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pninex-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, tokenizer
          coverage: none
      - run: composer update --prefer-dist --no-interaction --working-dir=tests/environments/laravel
      - run: composer require 'topthink/think-orm:^${{ matrix.orm }}' --no-update --working-dir=tests/environments/thinkphp
      - run: composer update --prefer-dist --no-interaction --working-dir=tests/environments/thinkphp
      - run: tools/test-frameworks.sh
        env:
          NINEX_TEST_DB_DRIVER: mysql
          NINEX_TEST_MYSQL_HOST: 127.0.0.1
          NINEX_TEST_MYSQL_PORT: '3306'
          NINEX_TEST_MYSQL_USER: root
          NINEX_TEST_MYSQL_PASSWORD: ninex-test-only
  packaged-consumers:
    runs-on: ubuntu-latest
    env:
      NINEX_PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '2.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, pdo_sqlite, mbstring, tokenizer
          coverage: none
      - run: php tools/build-package.php --ref=HEAD --version="$NINEX_PACKAGE_VERSION"
      - run: php tools/test-consumers.php --composer="$(command -v composer)" --version="$NINEX_PACKAGE_VERSION"
