<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ninex Lib</title>
  <desc id="desc">可移植的 PHP CRUD 工具包。一条命令生成资源，公共核心独立，Laravel 与 ThinkPHP 按需接入。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d5efe3" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="bounds"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="320" fill="#eff3eb"/>
    <path d="M544 0H1200V320H496Z" fill="#18372f"/>
    <path d="M544 0H1200V320H496Z" fill="url(#grid)"/>
    <path d="M529 0L481 320" stroke="#9cb8a2" stroke-width="1"/>
    <rect x="54" y="43" width="8" height="8" fill="#207354"/>
    <text x="75" y="52" fill="#466657" font-family="Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.8">PHP / APPLICATION TOOLKIT</text>
    <text x="51" y="150" fill="#182e27" font-family="'Avenir Next', 'Trebuchet MS', sans-serif" font-size="78" font-weight="800" letter-spacing="-4">Ninex</text>
    <text x="283" y="150" fill="#207354" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-style="italic" letter-spacing="-3">Lib</text>
    <text x="57" y="194" fill="#344f43" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" letter-spacing="1">一条命令，生成完整 CRUD。</text>
    <path d="M56 235H411" stroke="#c4d0c0"/>
    <g fill="#466657" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.4">
      <text x="57" y="264">ONE PACKAGE</text>
      <text x="210" y="264">YOUR FRAMEWORK</text>
    </g>
    <circle cx="184" cy="260" r="2" fill="#207354"/>
    <rect x="570" y="40" width="574" height="241" rx="9" fill="#10271f" stroke="#4a695a"/>
    <path d="M570 82H1144" stroke="#314e40"/>
    <rect x="592" y="58" width="7" height="7" rx="1" fill="#bceaa4"/>
    <text x="612" y="67" fill="#bed2c3" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.8">CRUD / PRODUCT</text>
    <text x="1071" y="67" fill="#759985" font-family="Consolas, 'Liberation Mono', monospace" font-size="11">CLI</text>
    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="15">
      <text x="592" y="116" fill="#edf3e8"><tspan fill="#bceaa4">$ </tspan>vendor/bin/ninex make:crud Product \</text>
      <text x="610" y="144" fill="#bceaa4">--fields="name:string,status:boolean"</text>
      <path d="M592 165H1120" stroke="#294536"/>
      <text x="592" y="193" fill="#d1e0d0">Service · Controller · Routes</text>
      <text x="592" y="219" fill="#92ba9b">Validation · Transactions · Responses</text>
      <text x="592" y="253" fill="#829f88" font-size="12">Laravel / ThinkPHP / independent core</text>
    </g>
  </g>
</svg>
